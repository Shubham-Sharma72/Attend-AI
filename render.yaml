# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from the repository root. Everything app-related is in smart-attendance/.
databases:
  - name: attendai-db
    databaseName: attendai
    user: attendai
    plan: free
    region: singapore

services:
  - type: web
    name: attendai
    runtime: python
    plan: free
    region: singapore
    rootDir: smart-attendance
    buildCommand: bash build-render.sh
    startCommand: cd backend && python serve.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22.16.0
      # Render routes traffic to 0.0.0.0:$PORT.
      - key: HOST
        value: 0.0.0.0
      # Trust Render's proxy for the visitor's real IP and HTTPS detection.
      - key: TRUST_PROXY
        value: "1"
      # Lets you create the first admin in the browser (there is no "local PC").
      # After the admin exists the setup screen refuses anyway; set this to 0.
      - key: ALLOW_REMOTE_SETUP
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # Both organisations share this one free Postgres database.
      - key: DATABASE_URL
        fromDatabase:
          name: attendai-db
          property: connectionString
      - key: ITHUB_DATABASE_URL
        fromDatabase:
          name: attendai-db
          property: connectionString
